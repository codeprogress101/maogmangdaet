<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bantayog Monument Hybrid Tour</title>
  <style>
    body { margin: 0; overflow: hidden; }
    #ui {
      position: absolute; top: 10px; left: 10px;
      background: rgba(255,255,255,0.8); padding: 8px; border-radius: 6px;
    }
    button { margin: 4px; padding: 6px 12px; cursor: pointer; }
  </style>
</head>
<body>
<div id="ui">
  <button id="prevBtn">⬅ Previous</button>
  <button id="nextBtn">Next ➡</button>
  <button id="playBtn">▶ Auto Tour</button>
  <button id="stopBtn">⏸ Stop</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.146.0/examples/js/controls/OrbitControls.js"></script>

<script>
let scene, camera, renderer, controls, monument;
let tour = [], tourIdx = 0, playing = false;
let lerpStart, lerpDur, startPos, startTgt, endPos, endTgt;

init();
animate();

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xbfd1e5);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 2000);
  camera.position.set(20, 15, 25);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Lights
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1));
  const sun = new THREE.DirectionalLight(0xffffff, 1);
  sun.position.set(-50, 80, 50);
  scene.add(sun);

  // Ground
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(300, 300),
    new THREE.MeshStandardMaterial({ color: 0xcccccc })
  );
  ground.rotation.x = -Math.PI/2;
  scene.add(ground);

  // Controls
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  // Load texture (your traced PNG)
  const texLoader = new THREE.TextureLoader();
  texLoader.load('assets/images/bantayog.png', function(texture) {
    const geo = new THREE.BoxGeometry(8, 20, 1); // thin monument box
    const matFront = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
    const matBack = new THREE.MeshBasicMaterial({ color: 0xffffff }); // plain back
    const materials = [matBack, matBack, matBack, matBack, matFront, matBack]; // assign
    monument = new THREE.Mesh(geo, materials);
    scene.add(monument);

    monument.position.set(0, 10, 0); // raise above ground

    // Setup waypoints
    const center = new THREE.Vector3(0, 10, 0);
    tour = [
      { pos: new THREE.Vector3(30, 15, 30), tgt: center },
      { pos: new THREE.Vector3(0, 15, 40), tgt: center },
      { pos: new THREE.Vector3(-30, 15, 0), tgt: center },
      { pos: new THREE.Vector3(0, 40, 0), tgt: center }
    ];
    goTo(0, 0);
  });

  // Buttons
  document.getElementById("nextBtn").onclick = () => step(1);
  document.getElementById("prevBtn").onclick = () => step(-1);
  document.getElementById("playBtn").onclick = () => { playing = true; };
  document.getElementById("stopBtn").onclick = () => { playing = false; };

  window.addEventListener("resize", onResize);
}

function step(dir) {
  if (!tour.length) return;
  tourIdx = (tourIdx + dir + tour.length) % tour.length;
  goTo(tourIdx, 1500);
}

function goTo(i, duration) {
  if (!tour.length) return;
  const wp = tour[i];
  startPos = camera.position.clone();
  startTgt = controls.target.clone();
  endPos = wp.pos.clone();
  endTgt = wp.tgt.clone();
  lerpDur = duration;
  lerpStart = performance.now();
}

function updateLerp() {
  if (!lerpDur) return;
  const t = Math.min((performance.now() - lerpStart) / lerpDur, 1);
  camera.position.lerpVectors(startPos, endPos, t);
  controls.target.lerpVectors(startTgt, endTgt, t);
  if (t >= 1) lerpDur = 0;
}

function autoPlay() {
  if (!playing || !tour.length || lerpDur) return;
  step(1);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);
  updateLerp();
  autoPlay();
  controls.update();
  renderer.render(scene, camera);
}
</script>
</body>
</html>
